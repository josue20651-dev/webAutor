<!-- HEADER TIENDA -->
<div class="tienda-header">
  <div class="tienda-tag">Tienda</div>
  <h1>Mis obras</h1>
  <p class="tienda-subtitle">Lleva una historia contigo</p>
</div>
 
<!-- GRID DE PRODUCTOS -->
<section class="contenido">
  <div class="productos" *ngFor="let novela of novelas">
    <div class="producto-img-wrap">
      <img [src]="novela.imagen" alt="{{ novela.titulo }}" class="imgProducto">
    </div>
    <div class="producto-body">
      <h2 class="tituloProducto">{{ novela.titulo }}</h2>
      <p class="descripcionProducto">{{ novela.descripcion }}</p>
      <h2 class="precioProducto">${{ novela.precio }} USD</h2>
 
      <!-- Selector de edición -->
      <div class="edicion-selector">
 
        <!-- Pill Física — desactivada si fisicoProximo es true -->
        <div class="pill-wrap" [class.tiene-tooltip]="novela.fisicoProximo">
          <button type="button"
                  class="edicion-pill"
                  [class.activo]="novela.fisico"
                  [class.proximamente]="novela.fisicoProximo"
                  [disabled]="novela.fisicoProximo"
                  (click)="!novela.fisicoProximo && (novela.fisico = !novela.fisico)">
            <span class="pill-icon">📦</span>
            Física
          </button>
          <span class="pill-tooltip" *ngIf="novela.fisicoProximo">Próximamente</span>
        </div>
 
        <!-- Pill eBook — activa normalmente -->
        <button type="button"
                class="edicion-pill"
                [class.activo]="novela.online"
                (click)="novela.online = !novela.online">
          <span class="pill-icon">📖</span>
          eBook
        </button>
 
      </div>
 
      <button type="button"
              class="btn-agregar"
              (click)="carrito.agregarCarrito(novela)"
              [disabled]="!novela.fisico && !novela.online">
        Agregar al carrito
      </button>
 
      <div class="producto-perks">
        <span class="perk">eBook Disponible</span>
        <span class="perk perk-pronto">Edición Física · Próximamente</span>
      </div>
    </div>
  </div>
</section>
