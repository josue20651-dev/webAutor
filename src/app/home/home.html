<section class="carrusel-section">
 
  <!-- Pétalos decorativos laterales -->
  <svg class="carrusel-floral-l" viewBox="0 0 120 200" fill="none">
    <ellipse cx="10"  cy="60"  rx="55" ry="40" fill="rgba(232,180,184,0.18)"/>
    <ellipse cx="0"   cy="110" rx="45" ry="32" fill="rgba(181,196,177,0.15)"/>
    <ellipse cx="30"  cy="155" rx="30" ry="22" fill="rgba(232,180,184,0.12)"/>
  </svg>
  <svg class="carrusel-floral-r" viewBox="0 0 120 200" fill="none">
    <ellipse cx="110" cy="60"  rx="55" ry="40" fill="rgba(181,196,177,0.18)"/>
    <ellipse cx="120" cy="110" rx="45" ry="32" fill="rgba(232,180,184,0.15)"/>
    <ellipse cx="90"  cy="155" rx="30" ry="22" fill="rgba(181,196,177,0.12)"/>
  </svg>
 
  <!-- Título sección -->
  <div class="carrusel-header">
    <div class="carrusel-rule"></div>
    <h2 class="carrusel-titulo">Encuéntrame en</h2>
    <div class="carrusel-rule"></div>
  </div>
 
  <div class="carrusel-wrapper">
 
    <!-- Botón anterior -->
    <button class="carrusel-btn carrusel-btn-prev" (click)="prevSlide()" aria-label="Anterior">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
 
    <!-- Track de slides -->
    <div class="carrusel-track-wrap">
      <div class="carrusel-track" [style.transform]="'translateX(-' + (slideActivo * 100) + '%)'">
 
        <!-- SLIDE 1 — Amazon -->
        <div class="carrusel-slide">
          <a href="https://www.amazon.com" target="_blank" rel="noopener" class="slide-link">
            <div class="slide-icono amazon-icono">
              <svg viewBox="0 0 48 48" fill="none" width="56" height="56">
                <path d="M8 31c7 4.5 22 7 32-2" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M36 31l4-1.5-1.5 4" stroke="#FF9900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 10h4l3 14 3-10h3l3 10 3-14h4" stroke="#232F3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3 class="slide-nombre">Amazon</h3>
            <p class="slide-desc">Consigue la edición física<br>o el eBook en Amazon</p>
            <span class="slide-cta">Ver en Amazon →</span>
          </a>
        </div>
 
        <!-- SLIDE 2 — Wattpad -->
        <div class="carrusel-slide">
          <a href="https://www.wattpad.com" target="_blank" rel="noopener" class="slide-link">
            <div class="slide-icono wattpad-icono">
              <svg viewBox="0 0 48 48" fill="none" width="56" height="56">
                <circle cx="24" cy="24" r="18" fill="rgba(255,97,34,0.10)"/>
                <path d="M13 16l4 16 4-10 4 10 4-16" stroke="#FF6122" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3 class="slide-nombre">Wattpad</h3>
            <p class="slide-desc">Lee capítulos gratuitos<br>y sigue la historia</p>
            <span class="slide-cta">Leer en Wattpad →</span>
          </a>
        </div>
 
        <!-- SLIDE 3 — Por editar -->
        <div class="carrusel-slide">
          <a href="#" class="slide-link">
            <div class="slide-icono custom-icono">
              <svg viewBox="0 0 48 48" fill="none" width="56" height="56">
                <circle cx="24" cy="24" r="18" fill="rgba(201,125,138,0.10)"/>
                <path d="M24 14v20M14 24h20" stroke="rgba(201,125,138,0.55)" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <h3 class="slide-nombre">Próximamente</h3>
            <p class="slide-desc">Nuevo lugar donde<br>encontrar mis obras</p>
            <span class="slide-cta">Descubrir →</span>
          </a>
        </div>
 
      </div>
    </div>
 
    <!-- Botón siguiente -->
    <button class="carrusel-btn carrusel-btn-next" (click)="nextSlide()" aria-label="Siguiente">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M7 4L12 9L7 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
 
  </div>
 
  <!-- Dots indicadores -->
  <div class="carrusel-dots">
    <button class="carrusel-dot" [class.activo]="slideActivo === 0" (click)="irASlide(0)"></button>
    <button class="carrusel-dot" [class.activo]="slideActivo === 1" (click)="irASlide(1)"></button>
    <button class="carrusel-dot" [class.activo]="slideActivo === 2" (click)="irASlide(2)"></button>
  </div>
 
</section>
